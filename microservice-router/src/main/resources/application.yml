server:
  port: 8082

spring:
  application:
    name: router-service

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 100
        concurrency: 10
        max-concurrency: 50

# RabbitMQ Configuration
rabbitmq:
  exchange: payment.hub.exchange
  
  queues:
    # Input queue
    router-input: router.queue
    
    # Output queues
    transform-npci: transform.npci.queue      # ✅ Must match NPCI exactly!
    transform-visa: transform.visa.queue
    transform-mastercard: transform.mastercard.queue
    fraud: fraud.queue
    notification: notification.queue
  
  routing-keys:
    transform-npci: transform.npci          # ✅ Routing key
    transform-visa: transform.visa
    transform-mastercard: transform.mastercard
    fraud: fraud.check
    notification: notification.send

# Logging
logging:
  level:
    com.paymenthub.router: DEBUG
    org.springframework.amqp: DEBUG    # ✅ Enable RabbitMQ debug logs